# Conda environment for the Habitat environment server (Python 3.9, habitat-sim 0.3.1).
#
#   conda env create -f habitat_server/environment.yml
#   conda activate habitat
#   # habitat-lab is installed WITHOUT dependencies on purpose: its requirements have no
#   # upper bound on numpy and would pull numpy 2.x, which breaks numpy-quaternion.
#   pip install --no-deps "habitat-lab==0.3.20231024"
#   pip install --force-reinstall "numpy>=1.20,<1.24"
#   pip install -e habitat_server
#
# Verified combination: python 3.9, habitat-sim 0.3.1 (headless, bullet), habitat-lab
# 0.3.20231024, numpy 1.23.5, gym 0.23.0, hydra-core 1.3.3, omegaconf 2.3.1.
name: habitat
channels:
  - aihabitat
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - cmake=3.14.0
  - habitat-sim=0.3.1=py3.9_headless_bullet_linux_3d6d67d6deae4ab2472cc84df7a3cef1503f606d
  # habitat-lab import-time dependencies (installed here because habitat-lab goes in --no-deps)
  - numpy>=1.20,<1.24
  - quaternion
  - attrs
  - pillow
  - scipy
  - numba
  - imageio
  - tqdm
  - gitpython
  - pip
  - pip:
      - "hydra-core>=1.2.0"
      - "omegaconf>=2.2.3"
      - "gym>=0.22.0,<0.23.1"
      - "opencv-python>=3.3.0,<4.10"
      # lightnav_habitat runtime
      - "pyzmq>=25.0.0"
      - "pyyaml>=6.0"
      - fastdtw
      - dtw-python
