# @package _global_
# VLN-CE R2R benchmark config (val_unseen, 1,839 episodes).
#
# Self-contained Hydra config: dataset settings are inlined, so no habitat-lab source
# checkout is needed. Measures that habitat-lab's structured configs do not model
# (success.success_distance, path_length, oracle_success, steps_taken, ndtw with
# gt_path/fdtw) are injected at runtime by VLNCEEnv._create_habitat_env().
#
# Paths below are examples relative to the working directory; point them at your data
# with --data-path / --scenes-dir or edit them in place.
#   data_path : <root>/{split}/{split}.json.gz  (the NDTW ground truth is expected at
#               <root>/{split}/{split}_gt.json.gz)
#   scenes_dir: directory containing mp3d/<scene>/<scene>.glb

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: vln_r2r
  - /habitat/task/actions@habitat.task.actions.velocity_control: velocity_control
  - /habitat/simulator/sensor_setups@habitat.simulator.agents.main_agent: rgbd_agent
  - /habitat/dataset: dataset_config_schema
  - _self_

habitat:
  environment:
    max_episode_steps: 500

  task:
    actions:
      velocity_control:
        # Per-step caps of 0.25 m and 30 deg, with each command integrated for 0.1 s:
        # lin_vel_range * time_step = max distance per step,
        # ang_vel_range * time_step = max rotation per step.
        lin_vel_range: [0.0, 2.5]      # m/s   -> 2.5 * 0.1 = 0.25 m/step
        ang_vel_range: [-300.0, 300.0] # deg/s -> 300 * 0.1 = 30 deg/step
        # Low thresholds: only a true zero-speed command counts as STOP.
        min_abs_lin_speed: 0.01        # m/s
        min_abs_ang_speed: 0.5         # deg/s
        time_step: 0.1                 # seconds

  dataset:
    type: VLN-CE-v1
    split: val_unseen
    data_path: "data/datasets/R2R_VLNCE_v1-3_preprocessed/{split}/{split}.json.gz"
    scenes_dir: "data/scene_datasets/"

  simulator:
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 480
            height: 270
            hfov: 120
            type: HabitatSimRGBSensor
            position: [0, 0.88, 0]
          depth_sensor:
            width: 480
            height: 270
            hfov: 120
            type: HabitatSimDepthSensor
            position: [0, 0.88, 0]
    forward_step_size: 0.25
    turn_angle: 15
    habitat_sim_v0:
      gpu_device_id: 0
      allow_sliding: true
